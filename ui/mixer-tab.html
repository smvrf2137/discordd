<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>mixer-tab</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }

    /* Kafelek przy prawej krawedzi (prawa strona dosunieta do krawedzi okna).
       W spoczynku waski - tylko ikona; po najechaniu rozszerza sie w LEWO
       i pokazuje etykiete (bez wysuwania poza krawedz). */
    .mixer-tab {
      position: fixed;
      top: 50%;
      right: 2px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 0;
      width: 28px;
      box-sizing: border-box;
      border: none;
      border-radius: 10px 0 0 10px;
      background: #5865f2;
      color: #fff;
      cursor: pointer;
      box-shadow: -2px 2px 10px rgba(0, 0, 0, 0.45);
      transition: width 0.18s ease, background 0.18s ease;
    }

    .mixer-tab:hover,
    .mixer-tab.active {
      width: 38px;
      background: #6b76f3;
    }

    .mixer-tab-icon {
      font-size: 16px;
      line-height: 1;
    }

    .mixer-tab-label {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.18s ease, opacity 0.18s ease;
    }

    .mixer-tab:hover .mixer-tab-label,
    .mixer-tab.active .mixer-tab-label {
      max-height: 70px;
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <button id="mixer-tab" class="mixer-tab" title="Mikser głośności">
    <span class="mixer-tab-icon">🔊</span>
    <span class="mixer-tab-label">Mikser</span>
  </button>

  <script>
    const tab = document.getElementById("mixer-tab");
    tab.addEventListener("click", () => {
      if (window.electronAPI && window.electronAPI.toggleMixer) {
        window.electronAPI.toggleMixer();
      }
    });
    if (window.electronAPI && window.electronAPI.onMixerActive) {
      window.electronAPI.onMixerActive((active) => {
        if (active) tab.classList.add("active");
        else tab.classList.remove("active");
      });
    }
  </script>
</body>
</html>
