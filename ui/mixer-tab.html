<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>mixer-tab</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }

    /* Kafelek przy prawej krawedzi (prawa strona dosunieta do krawedzi okna).
       W spoczynku waski - tylko ikona; po najechaniu rozszerza sie w LEWO
       i pokazuje etykiete (bez wysuwania poza krawedz). */
    .mixer-tab {
      position: fixed;
      top: 50%;
      right: 2px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 0;
      width: 28px;
      box-sizing: border-box;
      border: none;
      border-radius: 10px 0 0 10px;
      background: #5865f2;
      color: #fff;
      cursor: pointer;
      box-shadow: -2px 2px 10px rgba(0, 0, 0, 0.45);
      transition: width 0.18s ease, background 0.18s ease, box-shadow 0.3s ease;
      overflow: visible;
    }

    .mixer-tab:hover,
    .mixer-tab.active {
      width: 38px;
      background: #6b76f3;
    }

    .mixer-tab-icon {
      font-size: 16px;
      line-height: 1;
    }

    /* ===== Tryb LIVE (stream nadaje) - imersyjna animacja ===== */
    .mixer-tab.live {
      background: linear-gradient(180deg, #e01e37 0%, #b01424 100%);
      animation: tabBreathe 2.2s ease-in-out infinite;
    }

    .mixer-tab.live:hover,
    .mixer-tab.live.active {
      background: linear-gradient(180deg, #ff2d4b 0%, #c81626 100%);
    }

    /* "oddech" calego kafla: naprzemienne przyblizanie i czerwona poswiata */
    @keyframes tabBreathe {
      0%,
      100% {
        box-shadow: -2px 2px 10px rgba(224, 30, 55, 0.35);
        filter: saturate(1);
      }
      50% {
        box-shadow: -2px 2px 22px rgba(224, 30, 55, 0.85),
          0 0 14px rgba(255, 60, 80, 0.55);
        filter: saturate(1.25);
      }
    }

    /* czerwona kropka LIVE w rogu, pusujaca */
    .live-dot {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3b3b;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .mixer-tab.live .live-dot {
      opacity: 1;
      transform: scale(1);
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 59, 59, 0.7);
      }
      70% {
        box-shadow: 0 0 0 6px rgba(255, 59, 59, 0);
      }
    }

    /* napis LIVE zamiast "Mikser" po najechaniu, gdy stream nadaje */
    .mixer-tab .live-label {
      display: none;
      color: #ffd7da;
    }
    .mixer-tab.live:hover .live-label,
    .mixer-tab.live.active .live-label {
      display: block;
    }
    .mixer-tab.live:hover .mixer-tab-label,
    .mixer-tab.live.active .mixer-tab-label {
      display: none;
    }

    .mixer-tab-label {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.18s ease, opacity 0.18s ease;
    }

    .mixer-tab:hover .mixer-tab-label,
    .mixer-tab.active .mixer-tab-label {
      max-height: 70px;
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <button id="mixer-tab" class="mixer-tab" title="Mikser głośności">
    <span class="live-dot"></span>
    <span class="mixer-tab-icon">🔊</span>
    <span class="mixer-tab-label">Mikser</span>
    <span class="mixer-tab-label live-label">● LIVE</span>
  </button>

  <script>
    const tab = document.getElementById("mixer-tab");
    tab.addEventListener("click", () => {
      if (window.electronAPI && window.electronAPI.toggleMixer) {
        window.electronAPI.toggleMixer();
      }
    });
    if (window.electronAPI && window.electronAPI.onMixerActive) {
      window.electronAPI.onMixerActive((active) => {
        if (active) tab.classList.add("active");
        else tab.classList.remove("active");
      });
    }
    // status live z maina: live = pulsujaca animacja + kropka
    if (window.electronAPI && window.electronAPI.onTwitchLive) {
      window.electronAPI.onTwitchLive((live) => {
        if (live) {
          tab.classList.add("live");
          tab.title = "Mikser głośności — Twitch LIVE";
        } else {
          tab.classList.remove("live");
          tab.title = "Mikser głośności";
        }
      });
    }
  </script>
</body>
</html>
