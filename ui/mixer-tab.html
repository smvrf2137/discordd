<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>mixer-tab</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }

    /* Stos kafelkow przy prawej krawedzi okna Discorda. Kazdy kafelek w
       spoczynku waski (tylko ikona); po najechaniu rozszerza sie w LEWO
       (prawa krawedz dosunieta do krawedzi okna, wiec nie wysuwa sie poza
       nie). */
    .tabs-stack {
      position: fixed;
      top: 50%;
      right: 2px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .mixer-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 0;
      width: 28px;
      box-sizing: border-box;
      border: none;
      border-radius: 10px 0 0 10px;
      background: #5865f2;
      color: #fff;
      cursor: pointer;
      box-shadow: -2px 2px 10px rgba(0, 0, 0, 0.45);
      transition: width 0.18s ease, background 0.18s ease;
    }

    .mixer-tab:hover,
    .mixer-tab.active {
      width: 38px;
      background: #6b76f3;
    }

    .mixer-tab.active {
      background: #4752c4;
    }

    .mixer-tab-icon {
      font-size: 16px;
      line-height: 1;
    }

    .mixer-tab-label {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.18s ease, opacity 0.18s ease;
    }

    .mixer-tab:hover .mixer-tab-label,
    .mixer-tab.active .mixer-tab-label {
      max-height: 84px;
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <div class="tabs-stack">
    <button id="mixer-tab" class="mixer-tab" title="Mikser głośności">
      <span class="mixer-tab-icon">🔊</span>
      <span class="mixer-tab-label">Mikser</span>
    </button>
    <button id="manage-tab" class="mixer-tab" title="Zarządzanie serwerem">
      <span class="mixer-tab-icon">🛠️</span>
      <span class="mixer-tab-label">Panel</span>
    </button>
  </div>

  <script>
    const tab = document.getElementById("mixer-tab");
    tab.addEventListener("click", () => {
      if (window.electronAPI && window.electronAPI.toggleMixer) {
        window.electronAPI.toggleMixer();
      }
    });
    if (window.electronAPI && window.electronAPI.onMixerActive) {
      window.electronAPI.onMixerActive((active) => {
        if (active) tab.classList.add("active");
        else tab.classList.remove("active");
      });
    }

    const manageTab = document.getElementById("manage-tab");
    manageTab.addEventListener("click", () => {
      if (window.electronAPI && window.electronAPI.toggleManage) {
        window.electronAPI.toggleManage();
      }
    });
    if (window.electronAPI && window.electronAPI.onManageActive) {
      window.electronAPI.onManageActive((active) => {
        if (active) manageTab.classList.add("active");
        else manageTab.classList.remove("active");
      });
    }
  </script>
</body>
</html>
